<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/node_modules/@fontsource/inter/800.css">
<link rel="stylesheet" href="/node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="/node_modules/@fontsource/jetbrains-mono/700.css">
<style>
  html, body { margin: 0; }
  .og { width: 1200px; height: 630px; position: relative; overflow: hidden; color: #15221b; font-family: Inter, sans-serif;
    background: radial-gradient(circle at 1px 1px, rgba(21,34,27,.09) 1px, transparent 0) 0 0 / 22px 22px, #f6f7f2; }
  .copy { position: absolute; left: 72px; top: 70px; width: 600px; }
  .kicker { font: 700 17px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #12a15a; }
  .wm { color: #15221b; margin: 22px 0 24px; width: 520px; }
  .wm svg { width: 100%; height: auto; display: block; }
  h1 { font-size: 52px; line-height: 1.08; letter-spacing: -.02em; margin: 0 0 22px; font-weight: 800; }
  h1 span { color: #12a15a; }
  .pills { display: flex; gap: 10px; flex-wrap: wrap; }
  .pill { font: 600 18px Inter, sans-serif; padding: 9px 16px; border-radius: 999px; background: #fff; border: 1.5px solid #d3d9cd; }
  .pill.dark { background: #0b1410; color: #5dff8f; border-color: #0b1410; }
  .cast { position: absolute; right: 64px; top: 66px; display: grid; grid-template-columns: repeat(2, 206px); gap: 16px; }
  .tile { background: #0b1410; padding: 10px; border-radius: 24px; box-shadow: 0 14px 30px rgba(11,20,16,.22); }
  .tile:nth-child(1) { transform: rotate(-3deg); } .tile:nth-child(2) { transform: rotate(2deg); } .tile:nth-child(3) { transform: rotate(2deg); } .tile:nth-child(4) { transform: rotate(-2deg); }
  .tile canvas { width: 186px; height: 186px; image-rendering: pixelated; display: block; border-radius: 14px; }
</style></head>
<body><div class="og">
  <div class="copy">
    <div class="kicker">LEARN ZCASH PRIVACY · ZECATHON</div>
    <div class="wm" id="wm"></div>
    <h1>Learn to use Zcash privately <span>in about 10 minutes.</span></h1>
    <div class="pills"><span class="pill">7 short levels</span><span class="pill">1 game</span><span class="pill dark">your first private payment</span></div>
  </div>
  <div class="cast" id="cast"></div>
</div>
<canvas id="fav" style="display:none"></canvas>
<script type="module">
import { pixelText } from '/src/font.ts';
import { castPortrait, paint, portraitGrid, CAST } from '/src/identity.ts';
document.getElementById('wm').append(pixelText('GLASSTOWN', 12));
const cast = document.getElementById('cast');
for (const [w, p] of [['zee', 'wave'], ['peep', 'peer'], ['moss', 'key'], ['gus', 'smile']]) { const t = document.createElement('div'); t.className = 'tile'; t.append(castPortrait(w, p, 8)); cast.append(t); }
const fav = document.getElementById('fav');
paint(fav, portraitGrid(CAST.zee.traits, CAST.zee.seed, 'idle', 8), 8, '#0b1410');
window.__ready = true;
</script></body></html>
