<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/node_modules/@fontsource/fredoka/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/nunito/800.css">
<style>
  html, body { margin: 0; }
  .og { width: 1200px; height: 630px; position: relative; overflow: hidden; font-family: Nunito, sans-serif; color: #1c2b3a;
    background: linear-gradient(90deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,.82) 40%, rgba(255,255,255,.1) 72%), url(/town.webp) center/cover; }
  .copy { position: absolute; left: 64px; top: 92px; width: 640px; z-index: 2; }
  .kicker { font: 800 20px Nunito; letter-spacing: .12em; text-transform: uppercase; color: #17806f; }
  h1 { font: 700 112px/1.05 Fredoka; white-space: nowrap; margin: 10px 0 18px; background: linear-gradient(120deg, #1c2b3a 30%, #22a698 70%, #7a68dc); -webkit-background-clip: text; color: transparent; }
  .lede { font: 700 34px/1.25 Fredoka; margin: 0 0 26px; }
  .pill { display: inline-block; font: 800 22px Nunito; padding: 12px 22px; border-radius: 99px; background: #22a698; color: #fff; box-shadow: 0 5px 0 #17806f; }
  .cast img { position: absolute; bottom: 0; filter: drop-shadow(0 14px 18px rgba(28,43,58,.22)); }
</style></head>
<body><div class="og">
  <div class="copy">
    <div class="kicker">A Zcash onboarding game</div>
    <h1>Glasstown</h1>
    <p class="lede">Everyone can see your money.<br>Let’s fix that.</p>
    <span class="pill">Zero → your first shielded tx</span>
  </div>
  <div class="cast">
    <img src="/chars/peep/peer.webp" style="height:330px; left:820px; bottom:150px">
    <img src="/chars/gus/smile.webp" style="height:330px; left:990px; bottom:70px">
    <img src="/chars/zee/wave.webp" style="height:430px; left:700px; bottom:-10px">
    <img src="/chars/moss/key.webp" style="height:250px; left:880px; bottom:-6px">
  </div>
</div></body></html>
