<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/node_modules/@fontsource/jetbrains-mono/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/jetbrains-mono/700.css">
<style>
  html, body { margin: 0; background: #000; }
  .og { width: 1200px; height: 630px; position: relative; overflow: hidden; color: #c8ffdc; font-family: 'JetBrains Mono', monospace;
    background-color: #000; background-image: linear-gradient(rgba(93,255,143,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(93,255,143,.05) 1px, transparent 1px); background-size: 24px 24px; }
  .frame { position: absolute; inset: 24px; border: 2px solid #23462f; }
  .copy { position: absolute; left: 72px; top: 76px; width: 640px; }
  .kicker { font-size: 18px; letter-spacing: .28em; color: #4f9e70; }
  .wm { color: #fff; margin: 22px 0 26px; width: 600px; }
  .wm svg { width: 100%; height: auto; display: block; }
  .lede { font-size: 30px; line-height: 1.4; color: #fff; margin: 0 0 22px; font-weight: 700; }
  .lede span { color: #5dff8f; }
  .meta { font-size: 17px; letter-spacing: .14em; color: #4f9e70; }
  .meta b { color: #5dff8f; font-weight: 400; }
  .cast { position: absolute; right: 64px; top: 70px; display: grid; grid-template-columns: repeat(2, 196px); gap: 14px; }
  .cast canvas { width: 196px; height: 196px; image-rendering: pixelated; border: 2px solid #23462f; background: #07100b; display: block; }
  .cast .red { border-color: #4a1f1f; }
  .tag { position: absolute; left: 72px; bottom: 60px; font-size: 16px; letter-spacing: .2em; color: #5dff8f; }
</style></head>
<body><div class="og"><div class="frame"></div>
  <div class="copy">
    <div class="kicker">A ZCASH INITIATION · ZECATHON</div>
    <div class="wm" id="wm"></div>
    <p class="lede">Every wallet is glass.<br><span>Get out.</span></p>
    <div class="meta">8 NODES · 1 ARCADE GAME · <b>YOUR FIRST SHIELDED TX</b></div>
  </div>
  <div class="cast" id="cast"></div>
  <div class="tag">■ NO WALLET CONNECT · NEVER ASKS FOR YOUR SEED</div>
</div>
<canvas id="fav" style="display:none"></canvas>
<script type="module">
import { pixelText } from '/src/font.ts';
import { castPortrait, paint, portraitGrid, CAST } from '/src/identity.ts';
document.getElementById('wm').append(pixelText('GLASSTOWN', 12));
const cast = document.getElementById('cast');
for (const [w, p] of [['zee', 'wave'], ['peep', 'peer'], ['moss', 'key'], ['gus', 'smile']]) { const c = castPortrait(w, p, 8); if (w === 'peep' || w === 'gus') c.classList.add('red'); cast.append(c); }
const fav = document.getElementById('fav');
paint(fav, portraitGrid(CAST.zee.traits, CAST.zee.seed, 'idle', 8), 8, '#000');
window.__ready = true;
</script></body></html>
